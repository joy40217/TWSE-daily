name: 每日抓取證交所資料

on:
  # 平常由 Cloudflare Worker（cloudflare/dispatch.js）在台灣 18:23、22:23 用 workflow_dispatch 準時觸發；
  # GitHub 自己的排程常延遲 4～5 小時，只留一個當備援：Worker 沒觸發成功時，最晚隔天清晨補上
  schedule:
    - cron: "47 15 * * 1-5"   # UTC，台灣 23:47（實際多半凌晨 4～5 點才跑）；有跑過的日子不會重複通知
  workflow_dispatch:
    inputs:
      report:
        description: "抓完資料後產生報告並發布網頁"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily   # 同一時間只跑一個，避免兩次執行同時 push
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # 程式輸出馬上寫進 log，每一行的時間戳才準，看得出哪個步驟慢

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 抓取資料
        run: python scripts/fetch.py

      - name: 提交新資料
        if: always()   # 就算部分資料集失敗，成功的部分也照樣存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "$(bash scripts/commit_message.sh data data)"   # 訊息寫資料日期，不是執行當天
            # 回補 workflow 可能同時推了資料，所以先 pull；GitHub 偶爾回 500，等一下再試
            for i in 1 2 3; do git pull --rebase && git push && break; [ $i = 3 ] && exit 1; sleep 30; done
          fi

      # 排程是 Worker 的備援：最新交易日的報告已經完整（Worker 那幾次都跑過了）就不重跑報告，省下 15～20 分鐘；
      # 這次抓到的其他新資料（季報、股權分散等）隔天下午的報告會一起上網頁
      - name: 檢查最新報告是否完整
        id: stale
        if: always() && github.event_name == 'schedule'
        run: python scripts/report.py --stale

  report:
    needs: fetch
    # 排程只在最新交易日的報告還不完整時才產生（見上面的檢查；檢查沒跑成也照樣產生）；
    # 手動執行和 Worker 觸發則看「產生報告」（Worker 固定勾選）；
    # 抓資料部分失敗也照樣產生報告。Discord 通知由 report.py 判斷：最新交易日第一次有融資融券時才送
    if: ${{ !cancelled() && ((github.event_name == 'schedule' && needs.fetch.outputs.stale != 'false') || (github.event_name == 'workflow_dispatch' && inputs.report)) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿到 fetch 剛 commit 的資料

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 產生報告
        id: build
        run: python scripts/report.py

      - name: 提交報告資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/days
          if git diff --cached --quiet; then
            echo "沒有新報告"
          else
            git commit -m "$(bash scripts/commit_message.sh report site/data/days)"
            for i in 1 2 3; do git pull --rebase && git push && break; [ $i = 3 ] && exit 1; sleep 30; done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4

      # 網頁發布後才送通知，點連結時一定看得到新報告
      - name: 安裝中文字型（圖表用）
        if: steps.build.outputs.new_day != ''
        # 只下載圖表用的繁中字型一個檔（約 16 MB）；用 apt 裝整包 fonts-noto-cjk 要 4 分鐘以上
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 3 -o ~/.local/share/fonts/NotoSansCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf
          pip install matplotlib

      - name: 送出 Discord 通知
        if: steps.build.outputs.new_day != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scripts/report.py --notify ${{ steps.build.outputs.new_day }}
