name: 每日抓取證交所資料

on:
  schedule:
    # GitHub 用 UTC 時間（台灣 = UTC+8），週一到週五
    # 避開整點：整點是 GitHub 排程最壅塞的時段，常被延遲甚至直接丟棄
    - cron: "7 7 * * 1-5"     # 台灣 15:07：加權指數、個股收盤行情已公布（約 14:00，14:53 前可能還會更正），先更新網頁（不通知）
    - cron: "23 10 * * 1-5"   # 台灣 18:23：抓本益比、三大法人等晚點公布的資料，更新網頁（不通知）
    - cron: "23 14 * * 1-5"   # 台灣 22:23：融資融券公布後再抓一次，更新網頁並送 Discord 通知
    - cron: "47 15 * * 1-5"   # 台灣 23:47：備援，上一次沒跑到時補上（有跑過則不會重複通知）
  workflow_dispatch:
    inputs:
      report:
        description: "抓完資料後產生報告並發布網頁"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily   # 同一時間只跑一個，避免兩次執行同時 push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 抓取資料
        run: python scripts/fetch.py

      - name: 提交新資料
        if: always()   # 就算部分資料集失敗，成功的部分也照樣存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "$(bash scripts/commit_message.sh data data)"   # 訊息寫資料日期，不是執行當天
            git pull --rebase   # 回補 workflow 可能同時推了資料
            git push
          fi

  report:
    needs: fetch
    # 每次排程都更新網頁（收盤價等先公布的資料先上），手動執行則看有沒有勾選「產生報告」；
    # 抓資料部分失敗也照樣產生報告。Discord 通知由 report.py 判斷：最新交易日第一次有融資融券時才送
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report)) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿到 fetch 剛 commit 的資料

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 產生報告
        id: build
        run: python scripts/report.py

      - name: 提交報告資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/days
          if git diff --cached --quiet; then
            echo "沒有新報告"
          else
            git commit -m "$(bash scripts/commit_message.sh report site/data/days)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4

      # 網頁發布後才送通知，點連結時一定看得到新報告
      - name: 安裝中文字型（圖表用）
        if: steps.build.outputs.new_day != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install matplotlib

      - name: 送出 Discord 通知
        if: steps.build.outputs.new_day != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scripts/report.py --notify ${{ steps.build.outputs.new_day }}
