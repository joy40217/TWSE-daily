name: 每日抓取證交所資料

on:
  # 平常由 Cloudflare Worker（cloudflare/dispatch.js）在台灣 15:07、18:23、22:23 用 workflow_dispatch 準時觸發；
  # GitHub 自己的排程常延遲 4～5 小時，只留一個當備援：Worker 沒觸發成功時，最晚隔天清晨補上
  schedule:
    - cron: "47 15 * * 1-5"   # UTC，台灣 23:47（實際多半凌晨 4～5 點才跑）；有跑過的日子不會重複通知
  workflow_dispatch:
    inputs:
      report:
        description: "抓完資料後產生報告並發布網頁"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily   # 同一時間只跑一個，避免兩次執行同時 push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 抓取資料
        run: python scripts/fetch.py

      - name: 提交新資料
        if: always()   # 就算部分資料集失敗，成功的部分也照樣存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "$(bash scripts/commit_message.sh data data)"   # 訊息寫資料日期，不是執行當天
            # 回補 workflow 可能同時推了資料，所以先 pull；GitHub 偶爾回 500，等一下再試
            for i in 1 2 3; do git pull --rebase && git push && break; [ $i = 3 ] && exit 1; sleep 30; done
          fi

  report:
    needs: fetch
    # 每次排程都更新網頁（收盤價等先公布的資料先上）；手動執行和 Worker 觸發則看「產生報告」（Worker 固定勾選）；
    # 抓資料部分失敗也照樣產生報告。Discord 通知由 report.py 判斷：最新交易日第一次有融資融券時才送
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report)) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿到 fetch 剛 commit 的資料

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 產生報告
        id: build
        run: python scripts/report.py

      - name: 提交報告資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/days
          if git diff --cached --quiet; then
            echo "沒有新報告"
          else
            git commit -m "$(bash scripts/commit_message.sh report site/data/days)"
            for i in 1 2 3; do git pull --rebase && git push && break; [ $i = 3 ] && exit 1; sleep 30; done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4

      # 網頁發布後才送通知，點連結時一定看得到新報告
      - name: 安裝中文字型（圖表用）
        if: steps.build.outputs.new_day != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          pip install matplotlib

      - name: 送出 Discord 通知
        if: steps.build.outputs.new_day != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scripts/report.py --notify ${{ steps.build.outputs.new_day }}
